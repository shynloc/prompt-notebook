services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prompt_notebook
      POSTGRES_USER: prompt_notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt_notebook -d prompt_notebook"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [prompt_notebook]

  migrate:
    image: prompt-notebook:${IMAGE_TAG:-preview}
    restart: "no"
    environment:
      DATABASE_URL: postgres://prompt_notebook:${POSTGRES_PASSWORD}@postgres:5432/prompt_notebook
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [prompt_notebook]

  web:
    image: prompt-notebook:${IMAGE_TAG:-preview}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: postgres://prompt_notebook:${POSTGRES_PASSWORD}@postgres:5432/prompt_notebook
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:?CREDENTIAL_ENCRYPTION_KEYS is required}
      CREDENTIAL_ACTIVE_KEY_ID: ${CREDENTIAL_ACTIVE_KEY_ID:?CREDENTIAL_ACTIVE_KEY_ID is required}
    ports:
      - "127.0.0.1:5488:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [prompt_notebook]

networks:
  prompt_notebook:

volumes:
  postgres_data:
