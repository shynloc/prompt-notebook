services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prompt_notebook
      POSTGRES_USER: prompt_notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt_notebook -d prompt_notebook"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [prompt_notebook]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis_data:/data]
    networks: [prompt_notebook]

  migrate:
    image: ${APP_IMAGE:-prompt-notebook}:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgres://prompt_notebook:${POSTGRES_PASSWORD}@postgres:5432/prompt_notebook
      REDIS_URL: redis://redis:6379/0
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [prompt_notebook]

  web:
    image: ${APP_IMAGE:-prompt-notebook}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        BUILD_APP_URL: ${APP_URL:?APP_URL is required}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_IP_ADDRESS_HEADERS: ${BETTER_AUTH_IP_ADDRESS_HEADERS:-}
      DATABASE_URL: postgres://prompt_notebook:${POSTGRES_PASSWORD}@postgres:5432/prompt_notebook
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Prompt Notebook <no-reply@example.com>}
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:?CREDENTIAL_ENCRYPTION_KEYS is required}
      CREDENTIAL_ACTIVE_KEY_ID: ${CREDENTIAL_ACTIVE_KEY_ID:?CREDENTIAL_ACTIVE_KEY_ID is required}
      AI_CONNECTION_TIMEOUT_MS: ${AI_CONNECTION_TIMEOUT_MS:-10000}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-60000}
      AI_REVERSE_PROMPT_TIMEOUT_MS: ${AI_REVERSE_PROMPT_TIMEOUT_MS:-120000}
    ports: ["127.0.0.1:${APP_PORT:-5488}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [prompt_notebook]

  generation-worker:
    image: ${APP_IMAGE:-prompt-notebook}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/generation-worker.mjs"]
    environment:
      DATABASE_URL: postgres://prompt_notebook:${POSTGRES_PASSWORD}@postgres:5432/prompt_notebook
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:?CREDENTIAL_ENCRYPTION_KEYS is required}
      CREDENTIAL_ACTIVE_KEY_ID: ${CREDENTIAL_ACTIVE_KEY_ID:?CREDENTIAL_ACTIVE_KEY_ID is required}
      AI_IMAGE_TIMEOUT_MS: ${AI_IMAGE_TIMEOUT_MS:-600000}
      GENERATION_WORKER_CONCURRENCY: 1
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [prompt_notebook]

networks:
  prompt_notebook:

volumes:
  postgres_data:
  redis_data:
