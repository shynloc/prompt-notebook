name: Bug report
description: Report reproducible Prompt Notebook behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps, placeholder: "1. Open…\n2. Click…\n3. Observe…" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: Browser, OS, deployment type, and relevant logs without secrets. }
    validations: { required: true }
