  <text x="852" y="500" fill="#172630" font-family="Georgia, 'DejaVu Serif', serif" font-size="27" font-style="italic">Orbital garden</text>
  <text x="852" y="525" fill="#68716C" font-family="Consolas, 'Liberation Mono', monospace" font-size="12">WARM LIGHT  /  BOLD GEOMETRY  /  NEW IDEAS</text>
  <path d="M853 542H1279" stroke="#CFC4B3"/>

  <rect x="1086" y="414" width="388" height="235" rx="4" fill="#050A0E" fill-opacity=".5"/>
  <rect x="1074" y="402" width="388" height="235" rx="4" fill="#182834" stroke="#59717D"/>
  <rect x="1074" y="402" width="4" height="235" rx="2" fill="#F36B45"/>
  <circle cx="1095" cy="424" r="3" fill="#F36B45"/>
  <circle cx="1108" cy="424" r="3" fill="#607D89"/>
  <circle cx="1121" cy="424" r="3" fill="#607D89"/>
  <text x="1437" y="428" text-anchor="end" fill="#9FB6BE" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.2">PROMPT / STRUCTURE</text>
  <path d="M1093 443H1441" stroke="#354B57"/>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="16">
    <text x="1097" y="474" fill="#C6D4D8">{</text>
    <text x="1115" y="503" fill="#F2AB83">&quot;subject&quot;<tspan fill="#C6D4D8">: &quot;orbital garden&quot;,</tspan></text>
    <text x="1115" y="532" fill="#F2AB83">&quot;light&quot;<tspan fill="#C6D4D8">: &quot;golden hour&quot;,</tspan></text>
    <text x="1115" y="561" fill="#F2AB83">&quot;style&quot;<tspan fill="#C6D4D8">: &quot;graphic study&quot;</tspan></text>
    <text x="1097" y="590" fill="#C6D4D8">}</text>
  </g>
  <text x="1097" y="616" fill="#88A793" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1">IDEA + IMAGE + CONTEXT</text>

  <path d="M92 660H1508" stroke="#60727D" stroke-opacity=".45"/>
  <text x="92" y="690" fill="#9BB0BB" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.5">YOUR IDEAS. YOUR MODELS. YOUR SPACE.</text>
  <text x="1508" y="690" text-anchor="end" fill="#7F929C" font-family="Consolas, 'Liberation Mono', monospace" font-size="11">SYNTHETIC ILLUSTRATION · NO USER DATA</text>
