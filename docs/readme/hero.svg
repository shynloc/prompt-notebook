  <rect x="832" y="115" width="469" height="450" rx="5" fill="url(#paper)"/>
  <text x="851" y="144" fill="#263744" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.4">FIELD NOTE / 001</text>
  <circle cx="1276" cy="139" r="4" fill="#F36B45"/>
  <g clip-path="url(#artClip)">
