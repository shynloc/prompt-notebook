  <path d="M755 44V716" stroke="#E8E1D5" stroke-opacity=".09"/>
  <path d="M1191 86C1383 86 1517 219 1517 390S1383 694 1191 694" stroke="#B9D3DE" stroke-opacity=".13"/>
  <path d="M1191 116C1366 116 1487 236 1487 390S1366 664 1191 664" stroke="#B9D3DE" stroke-opacity=".07"/>

  <rect x="92" y="83" width="35" height="35" rx="2" fill="#F36B45"/>
  <path d="M101 94H111C116 94 116 103 111 103H101V111M119 94V111" stroke="#101820" stroke-width="2.4"/>
  <text x="144" y="106" fill="#E8E1D5" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="3">THE CREATIVE FIELD NOTES</text>

  <text x="86" y="237" fill="#F8F0E2" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="-6">PROMPT</text>
  <text x="89" y="344" fill="#F8F0E2" font-family="Georgia, 'DejaVu Serif', serif" font-size="104" font-style="italic" letter-spacing="-5">Notebook.</text>
  <rect x="93" y="377" width="62" height="4" fill="#F36B45"/>
  <text x="92" y="424" fill="#F36B45" font-family="Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" letter-spacing="2">CAPTURE. ORGANIZE. CREATE.</text>
  <text x="92" y="474" fill="#B8C6CD" font-family="Arial, Helvetica, sans-serif" font-size="24">Turn scattered prompts into a living library.</text>
  <text x="92" y="509" fill="#B8C6CD" font-family="Arial, Helvetica, sans-serif" font-size="24">Keep the idea, the image, and the way you made it.</text>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2">
    <rect x="92" y="557" width="145" height="36" rx="18" stroke="#40515C"/>
    <circle cx="111" cy="575" r="3" fill="#8EBA9E"/>
    <text x="125" y="580" fill="#DAE0DD">SELF-HOSTED</text>
    <rect x="248" y="557" width="185" height="36" rx="18" stroke="#40515C"/>
    <text x="267" y="580" fill="#DAE0DD">YOUR AI WORKFLOW</text>
    <rect x="444" y="557" width="145" height="36" rx="18" stroke="#40515C"/>
    <text x="466" y="580" fill="#DAE0DD">MIT LICENSE</text>
  </g>

