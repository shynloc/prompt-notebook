<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Notebook — Capture. Organize. Create.</title>
  <desc id="desc">An original editorial illustration of a self-hosted prompt notebook, with invented geometric artwork and fictional prompt cards. No real application screenshots or user data.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1195 320) rotate(148) scale(680 490)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233A4A"/><stop offset="1" stop-color="#101820"/>
    </radialGradient>
    <linearGradient id="art" x1="847" y1="149" x2="1288" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9B693"/><stop offset=".5" stop-color="#D97750"/><stop offset="1" stop-color="#924B3C"/>
    </linearGradient>
    <linearGradient id="sphere" x1="1000" y1="193" x2="1122" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0C8"/><stop offset=".53" stop-color="#F5BB7F"/><stop offset="1" stop-color="#CC6A47"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#D7E3E9" stroke-opacity=".045"/>
    </pattern>
    <pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#151D24" fill-opacity=".08"/>
    </pattern>
    <clipPath id="artClip"><rect x="850" y="162" width="438" height="299" rx="2"/></clipPath>
  </defs>

  <rect width="1600" height="760" rx="12" fill="#101820"/>
  <rect width="1600" height="760" rx="12" fill="url(#ambient)"/>
  <rect width="1600" height="760" rx="12" fill="url(#grid)"/>
