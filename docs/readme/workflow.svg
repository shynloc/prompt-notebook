  <text x="56" y="401" fill="#A9BFC7" font-family="Arial, Helvetica, sans-serif" font-size="16">Use desktop or mobile web.</text>

  <path d="M299 305H380" stroke="#F28B60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="339" y="289" text-anchor="middle" fill="#8CA8AF" font-family="Consolas, 'Liberation Mono', monospace" font-size="10">HTTPS</text>

  <rect x="394" y="171" width="405" height="269" rx="5" fill="#F1E7D6"/>
  <rect x="394" y="171" width="5" height="269" rx="2" fill="#F36B45"/>
  <text x="418" y="205" fill="#7A766B" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.6">YOUR SERVER / DOCKER COMPOSE</text>
  <text x="418" y="246" fill="#172A33" font-family="Georgia, 'DejaVu Serif', serif" font-size="31" font-style="italic">Prompt Notebook</text>
