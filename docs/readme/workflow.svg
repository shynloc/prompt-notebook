  <rect x="298" y="465" width="178" height="24" rx="12" fill="#101C25"/>
  <text x="387" y="481" text-anchor="middle" fill="#A9BFC7" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1">SYNC / READ-ONLY SHARE</text>
  <path d="M34 518H1166" stroke="#415865"/>
  <text x="34" y="549" fill="#D4DDD9" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1">NO WORDPRESS. NO AUTHOR-OWNED SERVICE REQUIRED.</text>
  <text x="1166" y="549" text-anchor="end" fill="#7F98A2" font-family="Consolas, 'Liberation Mono', monospace" font-size="10">SYNTHETIC ILLUSTRATION · NO USER DATA</text>
