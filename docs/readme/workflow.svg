<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">One notebook. Your own stack.</title>
  <desc id="desc">A synthetic architecture diagram: a browser and Chrome extension connect to a self-hosted web application with authentication, PostgreSQL and Redis. User-configured AI providers and an image host are separate external services. No WordPress or author-owned server is required.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#DDE8E8" fill-opacity=".08"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#F28B60" stroke-width="1.5" fill="none"/></marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#8CA8AF" stroke-width="1.5" fill="none"/></marker>
  </defs>
  <rect width="1200" height="580" rx="12" fill="#101C25"/>
  <rect width="1200" height="580" rx="12" fill="url(#dots)"/>
  <rect x="34" y="35" width="43" height="22" rx="2" fill="#F36B45"/>
  <text x="55.5" y="50" text-anchor="middle" fill="#101C25" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">FLOW</text>
  <text x="92" y="53" fill="#9CB3BB" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2">LOCAL CONTROL / CONNECTED CREATIVITY</text>
  <text x="34" y="104" fill="#F5EDDE" font-family="Georgia, 'DejaVu Serif', serif" font-size="39" font-style="italic">One notebook. Your own stack.</text>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5">
    <text x="36" y="151" fill="#F28B60">01 / COLLECT</text>
    <text x="397" y="151" fill="#F28B60">02 / ORGANIZE</text>
    <text x="913" y="151" fill="#F28B60">03 / CREATE</text>
  </g>

  <rect x="34" y="171" width="264" height="269" rx="5" fill="#1B2B36" stroke="#415865"/>
  <path d="M35 207H297" stroke="#415865"/>
  <circle cx="53" cy="189" r="3" fill="#F28B60"/><circle cx="66" cy="189" r="3" fill="#657D87"/><circle cx="79" cy="189" r="3" fill="#657D87"/>
