    <text x="689" y="324">DURABLE IMAGE JOBS</text>
  </g>
  <text x="418" y="423" fill="#626C65" font-family="Arial, Helvetica, sans-serif" font-size="13">Your accounts, prompts and encrypted credentials.</text>

