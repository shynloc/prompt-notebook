  <text x="933" y="258" fill="#A9BFC7" font-family="Arial, Helvetica, sans-serif" font-size="14">Optimize · analyze · generate</text>
  <text x="933" y="281" fill="#88A793" font-family="Consolas, 'Liberation Mono', monospace" font-size="10">USER-CONFIGURED API</text>

