  <rect x="68" y="283" width="190" height="12" rx="1" fill="#EDD1AF"/>
  <path d="M69 289H248M69 309H222M69 327H181" stroke="#6D776E" stroke-width="3"/>
  <path d="M254 313L264 337L251 333L245 345Z" fill="#F36B45" stroke="#18303A" stroke-width="1.5"/>
