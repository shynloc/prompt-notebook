services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prompt_notebook_test
      POSTGRES_USER: prompt_notebook
      POSTGRES_PASSWORD: prompt_notebook
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt_notebook -d prompt_notebook_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - prompt_notebook_postgres_dev:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - prompt_notebook_redis_dev:/data

volumes:
  prompt_notebook_postgres_dev:
  prompt_notebook_redis_dev:
